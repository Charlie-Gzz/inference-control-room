<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Switchyard architecture: workload and trace feed an open-loop load generator, a Go router picks one of the vLLM replicas, a recorder saves every request, and the results feed the optimizer and the control room site">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/></marker></defs>
<rect width="1600" height="760" fill="#0B0F17"/>
<text x="40" y="50" fill="#E5E7EB" font-size="24" font-weight="700">Switchyard</text>
<text x="190" y="50" fill="#9CA3AF" font-size="16">how a request flows, and where every number comes from</text>
<rect x="300" y="80" width="940" height="640" rx="18" fill="#0E1420" stroke="#1F2937" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="322" y="110" fill="#9CA3AF" font-size="14" font-weight="600">ONE MODAL CONTAINER  ·  2 x NVIDIA L4  ·  localhost only, nothing exposed</text>
<rect x="40" y="160" width="210" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="145.0" y="195.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">Workload generator</text><text x="145.0" y="215.0" text-anchor="middle" fill="#9CA3AF" font-size="13">seeded prompts with</text><text x="145.0" y="232.0" text-anchor="middle" fill="#9CA3AF" font-size="13">shared prefixes</text>
<rect x="40" y="310" width="210" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="145.0" y="345.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">BurstGPT trace</text><text x="145.0" y="365.0" text-anchor="middle" fill="#9CA3AF" font-size="13">real arrival times,</text><text x="145.0" y="382.0" text-anchor="middle" fill="#9CA3AF" font-size="13">rescaled (CC BY 4.0)</text>
<path d="M250,208 L295,208 L295,260 L338,260" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M250,358 L295,358 L295,310 L338,310" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40" y="478" fill="#9CA3AF" font-size="13">Development and tests use a</text>
<text x="40" y="496" fill="#9CA3AF" font-size="13">local mock fleet with the same</text>
<text x="40" y="514" fill="#9CA3AF" font-size="13">API. It never produces</text>
<text x="40" y="532" fill="#9CA3AF" font-size="13">published numbers.</text>
<rect x="340" y="230" width="200" height="110" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="440.0" y="272.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">Load generator</text><text x="440.0" y="292.0" text-anchor="middle" fill="#9CA3AF" font-size="13">open loop: sends at the</text><text x="440.0" y="309.0" text-anchor="middle" fill="#9CA3AF" font-size="13">scheduled time, always</text>
<rect x="610" y="230" width="200" height="110" rx="12" fill="#1A1420" stroke="#FB7185" stroke-width="1.6"/><text x="710.0" y="272.0" text-anchor="middle" fill="#FB7185" font-size="17" font-weight="600">Router (Go)</text><text x="710.0" y="292.0" text-anchor="middle" fill="#9CA3AF" font-size="13">round-robin · least-loaded</text><text x="710.0" y="309.0" text-anchor="middle" fill="#9CA3AF" font-size="13">prefix-aware</text>
<rect x="340" y="510" width="200" height="110" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="440.0" y="552.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">Recorder</text><text x="440.0" y="572.0" text-anchor="middle" fill="#9CA3AF" font-size="13">per-request timings,</text><text x="440.0" y="589.0" text-anchor="middle" fill="#9CA3AF" font-size="13">/metrics every 250 ms</text>
<rect x="610" y="510" width="200" height="110" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="710.0" y="552.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">Autoscaler</text><text x="710.0" y="572.0" text-anchor="middle" fill="#9CA3AF" font-size="13">starts and stops replicas</text><text x="710.0" y="589.0" text-anchor="middle" fill="#9CA3AF" font-size="13">from load and KV use</text>
<path d="M542,285 L608,285" fill="none" stroke="#FB7185" stroke-width="1.8" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
<text x="575" y="196" text-anchor="middle" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">requests out, streamed tokens back</text>
<rect x="950" y="272" width="260" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="1080.0" y="316.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">vLLM replica 0</text><text x="1080.0" y="336.0" text-anchor="middle" fill="#9CA3AF" font-size="13">GPU 0 · Qwen2.5-7B · prefix cache</text>
<path d="M812,285 L880,285 L880,312 L948,312" fill="none" stroke="#FB7185" stroke-width="1.8" marker-end="url(#arrow-rose)" marker-start="url(#arrow-rose)"/>
<rect x="950" y="404" width="260" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="1080.0" y="448.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">vLLM replica 1</text><text x="1080.0" y="468.0" text-anchor="middle" fill="#9CA3AF" font-size="13">GPU 1 · Qwen2.5-7B · prefix cache</text>
<path d="M812,285 L880,285 L880,444 L948,444" fill="none" stroke="#FB7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
<path d="M440,342 L440,508" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="430" text-anchor="start" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">timings, decisions</text>
<path d="M542,565 L608,565" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575" y="553" text-anchor="middle" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">load</text>
<path d="M710,508 L710,342" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720" y="430" text-anchor="start" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">live replicas</text>
<path d="M812,600 L880,600 L880,474 L948,474" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="846" y="620" text-anchor="middle" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">start / stop</text>
<path d="M1080,502 L1080,668 L500,668 L500,622" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790" y="660" text-anchor="middle" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">/metrics every 250 ms</text>
<path d="M400,622 L400,700 L1265,700 L1265,208 L1288,208" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="835" y="692" text-anchor="middle" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">run files</text>
<rect x="1290" y="160" width="280" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="1430.0" y="195.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">Run files</text><text x="1430.0" y="215.0" text-anchor="middle" fill="#9CA3AF" font-size="13">results/runs/&lt;id&gt;/</text><text x="1430.0" y="232.0" text-anchor="middle" fill="#9CA3AF" font-size="13">requests · replicas · meta</text>
<rect x="1290" y="340" width="280" height="96" rx="12" fill="#131A26" stroke="#1F2937" stroke-width="1.6"/><text x="1430.0" y="375.0" text-anchor="middle" fill="#E5E7EB" font-size="17" font-weight="600">icr results</text><text x="1430.0" y="395.0" text-anchor="middle" fill="#9CA3AF" font-size="13">metrics · Pareto frontier</text><text x="1430.0" y="412.0" text-anchor="middle" fill="#9CA3AF" font-size="13">cheapest config for an SLO</text>
<rect x="1290" y="520" width="280" height="110" rx="12" fill="#1A1420" stroke="#FB7185" stroke-width="1.6"/><text x="1430.0" y="562.0" text-anchor="middle" fill="#FB7185" font-size="17" font-weight="600">Control room site</text><text x="1430.0" y="582.0" text-anchor="middle" fill="#9CA3AF" font-size="13">replays the real runs,</text><text x="1430.0" y="599.0" text-anchor="middle" fill="#9CA3AF" font-size="13">request by request</text>
<path d="M1430,258 L1430,338" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1442" y="302" text-anchor="start" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">saved runs</text>
<path d="M1430,438 L1430,518" fill="none" stroke="#9CA3AF" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1442" y="482" text-anchor="start" fill="#9CA3AF" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">summary + replay</text>
</svg>