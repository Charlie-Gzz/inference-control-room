[project]
name = "icr"
version = "0.1.0"
description = "Switchyard: a 4-GPU LLM serving fleet with prefix-cache-aware routing, measured and replayed in a control room."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.10",
    "matplotlib>=3.9",
    "modal>=1.0",
    "numpy>=2.0",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
icr = "icr.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.48",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word lists are written as split() strings on purpose

[tool.ruff.lint.per-file-ignores]
"src/icr/analysis/results.py" = ["E501"]  # markdown table rows read better on one line
"src/icr/assets/charts.py" = ["E501"]  # chart titles and subtitles are full sentences
"src/icr/assets/interactive.py" = ["E501"]  # HTML template and hover text
"src/icr/assets/story.py" = ["E501"]  # captions are full sentences

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
