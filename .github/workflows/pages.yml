name: pages

# Publishes the static control room (site/) to GitHub Pages.
# Prepared but NOT enabled: it only runs when started by hand, and it fails harmlessly
# until Pages is switched on in the repo settings (Settings > Pages > Source: GitHub Actions).
# The site uses relative paths, so it works under /inference-control-room/.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
